<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PM Knowledge - License 测试</title>
  <style>
    body{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;margin:0;background:#f5f6f8;color:#1f2328}
    .wrap{max-width:720px;margin:48px auto;padding:0 20px}
    .card{background:#fff;border:1px solid #d0d7de;border-radius:12px;padding:28px;box-shadow:0 6px 24px rgba(0,0,0,.06)}
    h1{margin-top:0}
    .box{padding:14px;border-radius:8px;background:#f6f8fa;margin:16px 0;line-height:1.7}
    .ok{color:#1a7f37;font-weight:800}
    .err{color:#cf222e;font-weight:800}
    code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  </style>
</head>
<body>
<main class="wrap">
  <section class="card">
    <h1>PM Knowledge License 测试</h1>
    <p>本页会读取当前浏览器之前保存的不可导出设备私钥，并尝试解密只为指定设备公钥生成的 License。</p>
    <div id="result" class="box">正在验证……</div>
    <div class="box">
      当前浏览器设备码：<br>
      <code id="deviceId">—</code>
    </div>
    <div class="box">
      License 目标设备码：<br>
      <code>PM-9CC9-B957-123E-1028</code>
    </div>
  </section>
</main>

<script>
(async () => {
  'use strict';

  const LICENSE = {"license_version": 1, "device_id": "PM-9CC9-B957-123E-1028", "algorithm": "RSA-OAEP", "hash": "SHA-256", "ciphertext_base64": "ePWhha73gb3D0wKU7+zUyC7L7fzbtuZxnvQ5vVYFvpmiPzqs8i7GapTX0DQajnon6Yjog1bXwhZwh71G2OIIvX2FwyxXVaDMwbe6XlCsLmgL3y4313SZZnoqiRSV1rvrL7n4X9naCsJho32bS9tEfdWu3YKtTOvPKZOzrVxOX9P+/yyTS8H+yk/TsG0jB187NV7IYT2UOQADItDJbaauysaMvhyWEZio7EMXsE4BSTJQa1XbN3LvytxzUC1Wzxl/dYk/WQfaQZ/aAHOT5Chrqul9nYNNKR+wxMEFElV+2AK/eECG5OZiV3olP4ECfxpPK7dMpAxjzVpBR59N6ez5fQ=="};
  const DB_NAME = 'pm-knowledge-device';
  const DB_VERSION = 1;
  const STORE_NAME = 'keys';
  const RECORD_KEY = 'device-keypair-v1';

  const result = document.getElementById('result');
  const deviceIdEl = document.getElementById('deviceId');

  function openDb() {
    return new Promise((resolve, reject) => {
      const req = indexedDB.open(DB_NAME, DB_VERSION);
      req.onupgradeneeded = () => {
        const db = req.result;
        if (!db.objectStoreNames.contains(STORE_NAME)) db.createObjectStore(STORE_NAME);
      };
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });
  }

  async function dbGet(key) {
    const db = await openDb();
    return new Promise((resolve, reject) => {
      const tx = db.transaction(STORE_NAME, 'readonly');
      const req = tx.objectStore(STORE_NAME).get(key);
      req.onsuccess = () => resolve(req.result || null);
      req.onerror = () => reject(req.error);
      tx.oncomplete = () => db.close();
    });
  }

  function base64ToBytes(b64) {
    const bin = atob(b64);
    const bytes = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    return bytes;
  }

  try {
    const record = await dbGet(RECORD_KEY);
    if (!record || !record.privateKey || !record.deviceId) {
      throw new Error('本浏览器没有设备身份，请先打开 device-test.html。');
    }

    deviceIdEl.textContent = record.deviceId;

    if (record.deviceId !== LICENSE.device_id) {
      throw new Error('当前设备码与 License 目标设备码不同。');
    }

    const plainBuffer = await crypto.subtle.decrypt(
      { name: 'RSA-OAEP' },
      record.privateKey,
      base64ToBytes(LICENSE.ciphertext_base64)
    );

    const payload = JSON.parse(new TextDecoder().decode(plainBuffer));

    if (
      payload.type !== 'pm-device-license-test' ||
      payload.message !== 'DEVICE_LICENSE_OK' ||
      payload.device_id !== record.deviceId
    ) {
      throw new Error('License 内容校验失败。');
    }

    result.innerHTML =
      '<span class="ok">授权验证成功。</span><br>' +
      '只有持有对应不可导出私钥的这个浏览器，才能解开这份 License。';

  } catch (err) {
    console.error(err);
    result.innerHTML =
      '<span class="err">授权验证失败。</span><br>' +
      String(err?.message || err);
  }
})();
</script>
</body>
</html>
