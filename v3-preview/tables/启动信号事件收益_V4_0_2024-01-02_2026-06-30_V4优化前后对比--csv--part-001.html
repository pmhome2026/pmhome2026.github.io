                );
                const payload = JSON.parse(new TextDecoder().decode(plaintext));
                if (
                    payload.type !== "pm-knowledge-device-license" ||
                    payload.version !== 3 ||
                    payload.device_id !== record.deviceId
                ) {
                    throw new Error("License 内容校验失败。");
                }
                if (payload.status !== "active") {
                    throw new Error("当前设备授权不是正常状态。");
                }
                if (payload.expires_at) {
                    const expiry = Date.parse(payload.expires_at);
                    if (!Number.isFinite(expiry)) {
                        throw new Error("License 到期时间格式异常。");
                    }
                    if (Date.now() > expiry) {
                        throw new Error("当前设备授权已过期。");
                    }
                }
                return payload;
            }

            async function pmCopyText(text, button) {
                await navigator.clipboard.writeText(text);
                const oldText = button.textContent;
                button.textContent = "已复制";
                setTimeout(() => {
                    button.textContent = oldText;
                }, 1200);
            }

            function pmShowDeviceGate(record, message, isError = false) {
                document.body.innerHTML = `
                    <main style="min-height:100vh;box-sizing:border-box;display:flex;align-items:flex-start;justify-content:center;padding:7vh 20px 40px;background:#f5f6f8;color:#1f2328;font-family:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;">
                        <section style="width:min(720px,100%);background:#fff;border:1px solid #d0d7de;border-radius:14px;padding:30px;box-sizing:border-box;box-shadow:0 8px 28px rgba(0,0,0,.07);">
                            <h1 style="margin:0 0 12px;font-size:26px;">PM Knowledge</h1>
                            <div style="margin:16px 0;padding:14px 16px;border-radius:9px;background:${isError ? "#fff1f0" : "#f6f8fa"};line-height:1.7;color:${isError ? "#cf222e" : "#1f2328"};">${message}</div>
                            <div style="margin:18px 0;padding:12px;border:1px solid #d8dee4;border-radius:8px;font-size:13px;color:#656d76;">资源：<strong>${PM_RESOURCE_ID}</strong><br>权限组：<strong>${PM_ACCESS_GROUP}</strong></div>
                            <p style="margin:22px 0 7px;font-weight:700;">设备码</p>
                            <div id="pm-device-id" style="font:700 22px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;word-break:break-all;">${record.deviceId}</div>
                            <button id="pm-copy-device-id" style="margin-top:12px;border:0;border-radius:8px;padding:10px 14px;background:#1f883d;color:#fff;font-weight:700;cursor:pointer;">复制设备码</button>
                            <p style="margin:24px 0 7px;font-weight:700;">设备公钥</p>
                            <textarea id="pm-device-public-key" readonly style="width:100%;min-height:120px;box-sizing:border-box;padding:10px;border:1px solid #d0d7de;border-radius:8px;resize:vertical;font:12px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;">${record.publicKeySpkiBase64}</textarea>
                            <div>
                                <button id="pm-copy-public-key" style="margin-top:10px;border:0;border-radius:8px;padding:10px 14px;background:#eaeef2;color:#1f2328;font-weight:700;cursor:pointer;">复制公钥</button>
                                <button id="pm-recheck-license" style="margin:10px 0 0 8px;border:0;border-radius:8px;padding:10px 14px;background:#0969da;color:#fff;font-weight:700;cursor:pointer;">重新检查授权</button>
                            </div>
                        </section>
                    </main>
                `;

                const copyDeviceButton = document.getElementById("pm-copy-device-id");
                const copyPublicKeyButton = document.getElementById("pm-copy-public-key");
                const recheckButton = document.getElementById("pm-recheck-license");

                copyDeviceButton.addEventListener("click", () =>
                    pmCopyText(record.deviceId, copyDeviceButton)
                );
                copyPublicKeyButton.addEventListener("click", () =>
                    pmCopyText(record.publicKeySpkiBase64, copyPublicKeyButton)
                );
                recheckButton.addEventListener("click", () => location.reload());
            }

            async function pmRunDeviceAuthorizationV3() {
                const record = await pmLoadOrCreateDeviceIdentity();
                const licenseUrl =
                    "/licenses-v3/" +
                    encodeURIComponent(record.deviceId) +
                    ".json?v=" +
                    Date.now();

                let response;
                try {
                    response = await fetch(licenseUrl, { cache: "no-store" });
                } catch (error) {
                    pmShowDeviceGate(record, "暂时无法检查设备授权，请检查网络后重试。", true);
                    return false;
                }

                if (response.status === 404) {
                    pmShowDeviceGate(
                        record,
                        "<strong>此设备尚未获得 V3 授权。</strong><br>请将设备码和设备公钥发送给管理员。"
                    );
                    return false;
                }

                if (!response.ok) {
                    pmShowDeviceGate(
                        record,
                        "<strong>授权检查失败。</strong><br>HTTP " + response.status,
                        true
                    );
                    return false;
                }

                try {
                    const license = await response.json();
                    const payload = await pmDecryptV3License(record, license);
                    const resource = payload.resource_keys?.[PM_RESOURCE_ID];

                    if (!resource) {
                        throw new Error("当前设备没有此资料的访问权限。");
                    }
                    if (resource.group !== PM_ACCESS_GROUP) {
                        throw new Error("资源权限组校验失败。");
                    }
                    if (resource.resource_key_version !== PM_RESOURCE_KEY_VERSION) {
                        throw new Error("资源密钥版本不一致，请刷新授权。");
                    }
                    if (typeof resource.content_key !== "string" || resource.content_key.length < 1) {
                        throw new Error("资源解密密钥无效。");
                    }

                    const contentKey = resource.content_key;
                    resource.content_key = "";

                    const result = await staticrypt.handleDecryptionOfPage(
                        contentKey,
                        false
                    );

                    if (!result.isSuccessful) {
                        throw new Error("资料解密失败，License 或资源版本可能已经更新。");
                    }

                    return true;
                } catch (error) {
                    console.error(error);
                    pmShowDeviceGate(
                        record,
                        "<strong>无权访问此资料。</strong><br>" +
                            String(error?.message || error),
                        true
                    );
                    return false;
                }
            }
