<!doctype html><html><body><h2>申请资料权限</h2><input id="r" placeholder="资源"><input id="n" placeholder="姓名"><button onclick="apply()">提交</button><script>function apply(){let a=JSON.parse(localStorage.requests||'[]');a.push({user:JSON.parse(localStorage.session).user,resource:r.value,name:n.value,status:'PENDING'});localStorage.requests=JSON.stringify(a);alert('申请成功，请联系管理员');}</script></body></html>
