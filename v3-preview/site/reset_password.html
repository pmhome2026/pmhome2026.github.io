<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><title>找回密码</title></head>
<body>
<h2>找回密码</h2>

<input id="phone" placeholder="注册手机号"><br>
<input id="password" type="password" placeholder="新密码"><br>
<input id="confirm" type="password" placeholder="确认新密码"><br>

<button onclick="resetPassword()">重置密码</button>

<script>
function resetPassword(){
 let users=JSON.parse(localStorage.users||"[]");
 let u=users.find(x=>x.phone===phone.value);

 if(!u){
   alert("未找到账号");
   return;
 }
 if(password.value!==confirm.value){
   alert("两次密码不一致");
   return;
 }

 u.password=password.value;
 localStorage.users=JSON.stringify(users);

 alert("密码修改成功，请重新登录");
 location.href="login.html";
}
</script>
</body>
</html>
