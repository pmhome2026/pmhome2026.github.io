<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>注册账号</title>

<style>
body{
    font-family: Arial,"Microsoft YaHei",sans-serif;
}

.password-box{
    position:relative;
    width:260px;
    margin-bottom:8px;
}

.password-box input{
    width:260px;
    height:34px;
    padding-right:40px;
    box-sizing:border-box;
}

.eye-btn{
    position:absolute;
    right:8px;
    top:5px;
    width:26px;
    height:26px;
    border:none;
    background:transparent;
    cursor:pointer;
    display:none;
    font-size:16px;
    padding:0;
}

.password-box:hover .eye-btn,
.password-box:focus-within .eye-btn{
    display:block;
}

.eye-btn:hover{
    opacity:0.7;
}
</style>
</head>

<body>

<h2>注册账号</h2>

<input id="phone" placeholder="手机号"><br>
<input id="email" placeholder="邮箱（可选）"><br>

<div class="password-box">
    <input id="password" type="password" placeholder="密码" autocomplete="new-password">
    <button type="button" class="eye-btn"
        onmousedown="togglePassword('password')"
        ontouchstart="togglePassword('password')">👁</button>
</div>

<div class="password-box">
    <input id="confirm" type="password" placeholder="确认密码" autocomplete="new-password">
    <button type="button" class="eye-btn"
        onmousedown="togglePassword('confirm')"
        ontouchstart="togglePassword('confirm')">👁</button>
</div>

<button onclick="register()">注册</button>

<p>已有账号？<a href="login.html">立即登录</a></p>
<p>忘记密码？<a href="reset_password.html">找回密码</a></p>


<script>

function togglePassword(id){
    const input=document.getElementById(id);

    if(input.type==="password"){
        input.type="text";
    }else{
        input.type="password";
    }
}


async function sha256(text){
    const data = new TextEncoder().encode(text);
    const hash = await crypto.subtle.digest("SHA-256", data);
    return Array.from(new Uint8Array(hash))
        .map(b=>b.toString(16).padStart(2,"0"))
        .join("");
}

async function register(){

    const phoneValue=document.getElementById("phone").value.trim();
    const emailValue=document.getElementById("email").value.trim();
    const passwordValue=document.getElementById("password").value.trim();
    const confirmValue=document.getElementById("confirm").value.trim();


    if(!phoneValue || !passwordValue){
        alert("请输入手机号和密码");
        return;
    }


    // 手机号格式校验
    if(!/^1[3-9]\d{9}$/.test(phoneValue)){
        alert("请输入正确的手机号");
        return;
    }


    // 邮箱格式校验（填写时检查）
    if(emailValue && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(emailValue)){
        alert("请输入正确的邮箱格式");
        return;
    }


    // 密码强度检查
    if(passwordValue.length < 8){
        alert("密码长度不能少于8位");
        return;
    }


    if(passwordValue!==confirmValue){
        alert("两次密码不一致");
        return;
    }


    let users=[];

    try{
        users=JSON.parse(localStorage.getItem("users") || "[]");
    }catch(e){
        users=[];
    }


    // 手机号/邮箱重复检测
    const exists=users.some(user =>
        user.phone===phoneValue ||
        (emailValue && user.email===emailValue)
    );


    if(exists){
        alert("该手机号或邮箱已经注册，请直接登录");
        return;
    }


    const newUser={
        user_id:"U"+Date.now(),
        phone:phoneValue,
        email:emailValue,
        password:await sha256(passwordValue),
        role:"Customer",
        status:"ACTIVE"
    };


    users.push(newUser);


    localStorage.setItem(
        "users",
        JSON.stringify(users)
    );


    alert("注册成功，请登录");

    location.href="login.html";
}

</script>

</body>
</html>
