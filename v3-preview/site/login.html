<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>用户登录</title>

<style>
body{
    font-family: Arial,"Microsoft YaHei",sans-serif;
}

.login-box{
    width:260px;
}

.input-box{
    position:relative;
    width:260px;
    margin-bottom:8px;
}

.input-box input{
    width:260px;
    height:34px;
    box-sizing:border-box;
}

.password-box input{
    padding-right:40px;
}

.eye-btn{
    position:absolute;
    right:8px;
    top:4px;
    width:26px;
    height:26px;
    border:none;
    background:none;
    cursor:pointer;
    display:none;
    font-size:16px;
}

.password-box:hover .eye-btn,
.password-box:focus-within .eye-btn{
    display:block;
}
</style>
</head>

<body>

<div class="login-box">

<h2>用户登录</h2>

<div class="input-box">
    <input id="account" placeholder="手机号 / 邮箱">
</div>

<div class="input-box password-box">
    <input id="password" type="password" placeholder="密码">
    <button type="button" class="eye-btn" onclick="togglePassword()">👁</button>
</div>

<button onclick="login()">登录</button>

<p><a href="register.html">注册账号</a></p>
<p><a href="reset_password.html">忘记密码</a></p>

</div>

<script>

function togglePassword(){
    const input=document.getElementById("password");

    if(input.type==="password"){
        input.type="text";
    }else{
        input.type="password";
    }
}


async function sha256(text){
    const data = new TextEncoder().encode(text);
    const hash = await crypto.subtle.digest("SHA-256", data);
    return Array.from(new Uint8Array(hash))
        .map(b=>b.toString(16).padStart(2,"0"))
        .join("");
}

async function login(){

    const account =
        document.getElementById("account").value.trim();

    const password =
        document.getElementById("password").value.trim();


    // 兼容 localStorage.users 两种读取方式
    let rawUsers = localStorage.getItem("users");

    if(!rawUsers){
        alert("暂无注册用户，请先注册");
        return;
    }


    let users=[];

    try{
        users = JSON.parse(rawUsers);
    }catch(e){
        alert("用户数据异常，请重新注册");
        return;
    }


    const passwordHash = await sha256(password);

    const u = users.find(x =>
        (
            String(x.phone || "").trim() === account ||
            String(x.email || "").trim() === account
        )
        &&
        String(x.password || "").trim() === passwordHash
    );


    if(!u){
        alert("账号或密码错误");
        return;
    }


    localStorage.setItem(
        "session",
        JSON.stringify({
            user_id:u.user_id,
            phone:u.phone,
            email:u.email,
            role:u.role
        })
    );


    location.href="dashboard.html";

}

</script>

</body>
</html>
