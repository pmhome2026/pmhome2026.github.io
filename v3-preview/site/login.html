<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>用户登录</title>

<style>
body{
    font-family: Arial,"Microsoft YaHei",sans-serif;
}

.login-box{
    width:260px;
}

.input-box{
    position:relative;
    width:260px;
    margin-bottom:8px;
}

.input-box input{
    width:260px;
    height:34px;
    box-sizing:border-box;
}

.password-box input{
    padding-right:40px;
}

.eye-btn{
    position:absolute;
    right:8px;
    top:4px;
    width:26px;
    height:26px;
    border:none;
    background:none;
    cursor:pointer;
    display:none;
    font-size:16px;
}

.password-box:hover .eye-btn,
.password-box:focus-within .eye-btn{
    display:block;
}
</style>
</head>

<body>

<div class="login-box">

<h2>用户登录</h2>

<div class="input-box">
    <input id="account" placeholder="手机号 / 邮箱">
</div>

<div class="input-box password-box">
    <input id="password" type="password" placeholder="密码">
    <button type="button" class="eye-btn" onclick="togglePassword()">👁</button>
</div>

<button onclick="login()">登录</button>

<p><a href="register.html">注册账号</a></p>
<p><a href="reset_password.html">忘记密码</a></p>

</div>


<script>

function togglePassword(){

    const input=document.getElementById("password");

    if(input.type==="password"){
        input.type="text";
    }else{
        input.type="password";
    }

}


function login(){

    const account=
        document.getElementById("account").value.trim();

    const password=
        document.getElementById("password").value.trim();


    let users=
        JSON.parse(localStorage.users || "[]");


    let u=users.find(x=>
        (
            x.phone===account ||
            x.email===account
        )
        &&
        x.password===password
    );


    if(!u){

        alert("账号或密码错误");
        return;

    }


    localStorage.session=
        JSON.stringify({
            user_id:u.user_id,
            phone:u.phone,
            email:u.email,
            role:u.role
        });


    location.href="dashboard.html";

}

</script>

</body>
</html>
