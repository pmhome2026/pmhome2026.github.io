<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><title>用户登录</title></head>
<body>
<h2>用户登录</h2>

<input id="phone" placeholder="手机号"><br>
<input id="password" type="password" placeholder="密码"><br>

<button onclick="login()">登录</button>

<p><a href="register.html">注册账号</a></p>
<p><a href="reset_password.html">忘记密码</a></p>

<script>
function login(){
 let users=JSON.parse(localStorage.users||"[]");
 let u=users.find(x=>x.phone===phone.value && x.password===password.value);

 if(!u){
   alert("账号或密码错误");
   return;
 }

 localStorage.session=JSON.stringify({
   user_id:u.user_id,
   phone:u.phone
 });

 location.href="dashboard.html";
}
</script>
</body>
</html>
