<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>角色权限管理</title>
<link rel="stylesheet" href="assets/admin.css">
</head>
<body>

<header>
<h1>角色权限管理</h1>
<p>RBAC Role Management</p>
</header>

<main>
<div class="card">
<h2>角色列表</h2>
<table>
<thead>
<tr>
<th>角色</th>
<th>权限</th>
<th>状态</th>
</tr>
</thead>
<tbody id="role-list">
<tr><td colspan="3">Loading...</td></tr>
</tbody>
</table>
</div>
</main>

<script>
fetch("../api/roles.json")
.then(r=>r.json())
.then(data=>{
document.getElementById("role-list").innerHTML=data.map(role=>`
<tr>
<td>${role.role}</td>
<td>${role.permission}</td>
<td>${role.status}</td>
</tr>
`).join("");
});
</script>

</body>
</html>
