<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>管理员登录</title></head>
<body>
<h2>管理员登录</h2>
<input id="username" placeholder="管理员账号"><br>
<input id="password" type="password" placeholder="管理员密码"><br>
<button id="loginBtn">登录</button>

<script src="../config/admin_config.js"></script>
<script>
function login(){
    const u=document.getElementById("username").value.trim();
    const p=document.getElementById("password").value.trim();

    if(!window.ADMIN_CONFIG){
        alert("管理员配置加载失败，请检查 config/admin_config.js");
        return;
    }

    if(u===ADMIN_CONFIG.username && p===ADMIN_CONFIG.password){
        localStorage.setItem("admin_session",JSON.stringify({
            username:u,
            role:ADMIN_CONFIG.role,
            loginTime:new Date().toISOString()
        }));
        alert("管理员登录成功");
        window.location.href="index.html";
    }else{
        alert("管理员账号或密码错误");
    }
}

document.getElementById("loginBtn").onclick=login;
</script>
</body>
</html>
