<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>操作日志</title>
<link rel="stylesheet" href="assets/admin.css">
</head>
<body>

<header>
<h1>操作日志</h1>
<p>Security Audit Trail</p>
</header>

<main>
<div class="card">
<h2>最近操作</h2>
<table>
<thead>
<tr>
<th>时间</th>
<th>操作</th>
<th>用户</th>
<th>结果</th>
</tr>
</thead>
<tbody id="log-list">
<tr><td colspan="4">Loading...</td></tr>
</tbody>
</table>
</div>
</main>

<script>
fetch("../api/logs.json")
.then(r=>r.json())
.then(data=>{
document.getElementById("log-list").innerHTML=data.map(log=>`
<tr>
<td>${log.time}</td>
<td>${log.action}</td>
<td>${log.user}</td>
<td>${log.result}</td>
</tr>
`).join("");
});
</script>

</body>
</html>
