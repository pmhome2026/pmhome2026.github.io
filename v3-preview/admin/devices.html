<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Device Management V3</title>
<link rel="stylesheet" href="assets/admin.css">
</head>
<body>
<header>
<h1>Device Management V3</h1>
</header>
<main>
<section class="card">
<h2>Authorized Devices</h2>
<div id="device-list">Loading...</div>
</section>
</main>
<script src="assets/admin.js"></script>
<script>
document.addEventListener("DOMContentLoaded",()=>{
 fetch("../api/devices.json")
 .then(r=>r.json())
 .then(data=>{
   const list=document.getElementById("device-list");
   const devices=Array.isArray(data)?data:(data.devices||[]);
   if(!devices.length){list.innerHTML="<p>No devices found</p>";return;}
   list.innerHTML=devices.map(d=>`
    <div class="card">
      <p><b>${d.id||d.device_id||"UNKNOWN"}</b></p>
      <p>Status: ${d.status||"unknown"}</p>
      <p>Plan: ${d.plan||"unknown"}</p>
    </div>`).join("");
 })
 .catch(e=>document.getElementById("device-list").innerHTML="API loading failed");
});
</script>
</body>
</html>
