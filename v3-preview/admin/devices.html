<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Device Management V3</title>
<link rel="stylesheet" href="assets/admin.css">
</head>

<body>

<header>
<h1>Device Management V3</h1>
</header>

<main>
<div class="card">

<h2>Authorized Devices</h2>

<div id="device-list">
Loading...
</div>

</div>
</main>


<script>
async function loadDevices(){

    const container = document.getElementById("device-list");

    try{

        const response = await fetch("../api/devices.json");

        if(!response.ok){
            throw new Error("API unavailable");
        }

        const devices = await response.json();

        if(!Array.isArray(devices) || devices.length===0){
            container.innerHTML="<p>No authorized devices</p>";
            return;
        }


        container.innerHTML = devices.map(device => {

            return `
            <div class="device-item">

                <h3>${device.device_id || device.id || "UNKNOWN"}</h3>

                <p>
                Status:
                ${device.status || "UNKNOWN"}
                </p>

                <p>
                Plan:
                ${device.plan || device.package || device.subscription || "legacy_full"}
                </p>

                <p>
                License:
                ${device.license || "ACTIVE"}
                </p>

            </div>
            `;

        }).join("");

    }catch(error){

        container.innerHTML =
        "<p>Failed to load device information</p>";

        console.error(error);

    }

}

loadDevices();

</script>

</body>
</html>
