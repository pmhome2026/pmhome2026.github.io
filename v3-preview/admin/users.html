<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>用户权限管理</title>
<link rel="stylesheet" href="assets/admin.css">
</head>
<body>
<header>
<h1>用户权限管理</h1>
<p>RBAC User Management</p>
</header>

<main>
<div class="card">
<h2>用户列表</h2>
<table>
<thead>
<tr><th>用户</th><th>角色</th><th>状态</th></tr>
</thead>
<tbody id="user-list">
<tr><td colspan="3">Loading...</td></tr>
</tbody>
</table>
</div>
</main>

<script>
fetch("../api/users.json")
.then(r=>r.json())
.then(users=>{
 document.getElementById("user-list").innerHTML =
 users.map(u=>`
 <tr>
 <td>${u.username}</td>
 <td>${u.role}</td>
 <td>${u.status}</td>
 </tr>`).join("");
})
.catch(()=>{
 document.getElementById("user-list").innerHTML =
 "<tr><td colspan='3'>Load failed</td></tr>";
});
</script>

</body>
</html>
